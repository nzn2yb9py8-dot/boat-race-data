name: ボートレース過去365日分を一括保存

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boatrace-archive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 不足している日付を取得して順次保存
        shell: bash
        env:
          TZ: Asia/Tokyo
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          temp=$(mktemp -d)
          trap 'rm -rf "$temp"' EXIT
          anchor=$(date -d '2026-11-12 12:00:00' +%s)
          saved=0
          existing=0
          failed=0
          pending=0

          publish_batch() {
            if (( pending == 0 )); then
              return 0
            fi
            git commit -m "Save BOAT RACE archives through $day"
            git push origin HEAD:main
            echo "GitHubに保存済み 新規 $saved 日"
            pending=0
          }

          for ((i=1; i<=365; i++)); do
            day=$(date -d "@$((anchor - i * 86400))" +%Y%m%d)
            month=${day:0:6}
            short=${day:2}
            folder="archive/$month/$day"

            if [[ -s "$folder/b$short.lzh" && -s "$folder/k$short.lzh" ]]; then
              existing=$((existing + 1))
              continue
            fi

            complete=1
            for kind in B K; do
              prefix=${kind,,}
              file="$prefix$short.lzh"
              url="https://www1.mbrace.or.jp/od2/$kind/$month/$file"

              if ! curl -fsSL --connect-timeout 12 --max-time 30 \
                  --retry 1 --retry-max-time 45 \
                  -o "$temp/$file" "$url" ||
                  ! file "$temp/$file" | grep -qi 'LHa'; then
                echo "::warning::$day の $file を取得できませんでした"
                complete=0
                break
              fi
            done

            if (( complete )); then
              mkdir -p "$folder"
              cp "$temp/b$short.lzh" "$temp/k$short.lzh" "$folder/"
              git add -- "$folder"
              saved=$((saved + 1))
              pending=$((pending + 1))
              echo "取得 $day"
              if (( pending >= 10 )); then
                publish_batch
              fi
            else
              failed=$((failed + 1))
            fi
          done

          publish_batch
          echo "新規保存 $saved 日 / 保存済み $existing 日 / 取得失敗 $failed 日"
          if (( failed > 0 )); then
            exit 1
          fi
