name: ボートレース公式データの毎日保存

on:
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * *'

permissions:
  contents: write

concurrency:
  group: boatrace-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 前日分の公式ファイルを取得して保存
        shell: bash
        run: |
          set -euo pipefail
          export TZ=Asia/Tokyo
          day=$(date -d yesterday +%Y%m%d)
          month=${day:0:6}
          short_day=${day:2}
          folder="archive/$month/$day"
          temp=$(mktemp -d)
          trap 'rm -rf "$temp"' EXIT

          for kind in B K; do
            prefix=${kind,,}
            file="${prefix}${short_day}.lzh"
            url="https://www1.mbrace.or.jp/od2/$kind/$month/$file"
            curl --fail --silent --show-error --location \
              --connect-timeout 15 --max-time 60 --retry 2 \
              --output "$temp/$file" "$url"
            file "$temp/$file" | grep -qi 'LHa'
            echo "取得成功 $file"
          done

          mkdir -p "$folder"
          cp "$temp/"*.lzh "$folder/"
          git add -- "$folder"

          if git diff --cached --quiet; then
            echo "保存済み $folder"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Archive BOAT RACE data for $day"
          git push origin HEAD:main
          echo "履歴保存成功 $folder"
