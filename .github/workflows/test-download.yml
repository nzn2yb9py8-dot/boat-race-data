name: ボートレース公式データの毎日保存

on:
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * *'

permissions:
  contents: write

concurrency:
  group: boatrace-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 前日分の公式ファイルを取得して保存
        shell: bash
        run: |
          set -euo pipefail
          export TZ=Asia/Tokyo
          day=$(date -d yesterday +%Y%m%d)
          month=${day:0:6}
          short_day=${day:2}
          folder="archive/$month/$day"
          temp=$(mktemp -d)
          trap 'rm -rf "$temp"' EXIT

          for kind in B K; do
            prefix=${kind,,}
            file="${prefix}${short_day}.lzh"
            url="https://www1.mbrace.or.jp/od2/$kind/$month/$file"
            curl --fail --silent --show-error --location \
              --connect-timeout 15 --max-time 60 --retry 2 \
              --output "$temp/$file" "$url"
            file "$temp/$file" | grep -qi 'LHa'
            echo "取得成功 $file"
          done

          mkdir -p "$folder"
          cp "$temp/"*.lzh "$folder/"
                    sudo apt-get update -qq
          sudo apt-get install -y -qq libarchive-tools
          bsdtar -xOf "$folder/b${short_day}.lzh" > "$temp/program.txt"
          bsdtar -xOf "$folder/k${short_day}.lzh" > "$temp/result.txt"

          python3 - "$temp/program.txt" "$temp/result.txt" "$folder/races.json" <<'PY'
          import json
          import re
          import sys
          import unicodedata
          from pathlib import Path

          venues = {code: {} for code in ("18", "24", "19", "21", "13")}
          for kind, path in zip(("B", "K"), sys.argv[1:3]):
              venue = rows = None
              for raw in Path(path).read_bytes().decode("cp932").splitlines():
                  line = unicodedata.normalize("NFKC", raw).strip()
                  marker = re.fullmatch(r"(\d{2})" + kind + r"(BGN|END)", line)
                  if marker:
                      venue = marker[1] if marker[2] == "BGN" else None
                      rows = None
                      continue
                  if venue not in venues:
                      continue
                  heading = re.match(r"(\d{1,2})R\s", line)
                  if heading and (
                      "締切予定" in line if kind == "B"
                      else re.search(r"H\s*\d+m", line, re.I)
                  ):
                      rows = venues[venue].setdefault(heading[1], {}).setdefault(kind, [])
                  if rows is not None:
                      rows.append(raw.rstrip())

          count = sum(len(races) for races in venues.values())
          if not count or any(
              set(race) != {"B", "K"}
              for races in venues.values() for race in races.values()
          ):
              raise SystemExit("番組表と競走成績の組を確認できませんでした")
          Path(sys.argv[3]).write_text(
              json.dumps(venues, ensure_ascii=False), encoding="utf-8"
          )
          print(f"サイト用JSON作成成功 {count}レース")
          PY

          git add -- "$folder"

          if git diff --cached --quiet; then
            echo "保存済み $folder"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Archive BOAT RACE data for $day"
          git push origin HEAD:main
          echo "履歴保存成功 $folder"
