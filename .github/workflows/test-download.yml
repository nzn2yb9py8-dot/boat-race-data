name: ボートレース公式データの毎日取得

on:
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * *'

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: 前日の番組表と競走成績を取得
        id: fetch
        shell: bash
        run: |
          set -euo pipefail
          export TZ=Asia/Tokyo
          day=$(date -d yesterday +%Y%m%d)
          month=${day:0:6}
          short_day=${day:2}
          mkdir -p official

          for kind in B K; do
            prefix=${kind,,}
            file="${prefix}${short_day}.lzh"
            url="https://www1.mbrace.or.jp/od2/$kind/$month/$file"
            curl --fail --silent --show-error --location \
              --connect-timeout 15 --max-time 60 --retry 2 \
              --output "official/$file" "$url"
            file "official/$file" | grep -qi 'LHa'
            echo "取得成功 $file"
          done

          echo "day=$day" >> "$GITHUB_OUTPUT"

      - name: 取得ファイルを実行結果に保存
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-${{ steps.fetch.outputs.day }}
          path: official/*.lzh
          if-no-files-found: error
