name: 展示・オッズ取得テスト

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 大村1Rの公式ページをダウンロード
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.boatrace.jp/owpc/pc/race'
          query='hd=20261111&jcd=24&rno=1'
          mkdir -p pages

          for page in beforeinfo odds3t; do
            echo "=== $page ==="
            curl -fsSL --max-time 45 \
              -w 'HTTP %{http_code} / %{size_download} bytes\n' \
              "$base/$page?$query" -o "pages/$page.html"
            test -s "pages/$page.html"
          done

      - name: 確認用のHTMLを実行結果に保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omura-1r-official-pages
          path: pages/*.html
          if-no-files-found: warn
