name: 展示・オッズ取得テスト

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 大村1Rの公式ページを確認
        shell: bash
        run: |
        set -u
        base='https://www.boatrace.jp/owpc/pc/race'
        query='hd=20261111&jcd=24&rno=1'
        failed=0

          for page in beforeinfo odds3t; do
            echo "=== $page ==="
            if curl -fsSL --max-time 45 \
              -w 'HTTP %{http_code} / %{size_download} bytes / %{url_effective}\n' \
              "$base/$page?$query" -o "$page.html"; then
              if [ "$page" = beforeinfo ]; then
                label='展示タイム'
              else
                label='3連単|３連単'
              fi
              if grep -Eq "$label" "$page.html"; then
                echo '対象の見出しを確認'
              else
                echo 'ページは取得できましたが、対象の見出しが見つかりません'
                grep -im1 '<title' "$page.html" || true
                failed=1
              fi
            else
              echo 'ページの取得に失敗'
              failed=1
            fi
          done

          exit "$failed"
